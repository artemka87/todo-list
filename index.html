<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do | Список задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="app-card">
            <div class="app-header">
                <h1>Список задач</h1>
                <p class="date" id="date-display">Вторник, 24 Ноября</p>
            </div>

            <div class="input-section">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="task-input"
                        class="task-input"
                        placeholder="Что нужно сделать?"
                        autocomplete="off"
                    >
                    <button class="add-btn" id="add-btn">Добавить</button>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-info">
                    <span class="progress-text">Выполнено <span id="completed-count">0</span> из <span id="total-count">0</span></span>
                    <span class="progress-percent" id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    Все <span class="filter-count" id="count-all">0</span>
                </button>
                <button class="filter-btn" data-filter="active">
                    Активные <span class="filter-count" id="count-active">0</span>
                </button>
                <button class="filter-btn" data-filter="completed">
                    Выполненные <span class="filter-count" id="count-completed">0</span>
                </button>
            </div>

            <div class="tasks-container">
                <ul class="task-list" id="task-list"></ul>
                <div class="empty-state" id="empty-state">
                    <p>Нечего делать! 🎉</p>
                    <p class="empty-hint">Добавь первую задачу, чтобы начать</p>
                </div>
            </div>

            <div class="footer-section">
                <button class="clear-btn" id="clear-btn">Удалить готовые</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
