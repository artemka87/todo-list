<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Мой список задач</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <header class="header">
                <div class="header-content">
                    <h1><i class="fas fa-tasks"></i> Мой список задач</h1>
                    <p class="subtitle">Планируй, выполняй, побеждай!</p>
                </div>
                <div class="stats">
                    <span class="stat-item"><i class="fas fa-check-circle"></i> <span id="completed-count">0</span></span>
                    <span class="stat-item"><i class="fas fa-circle"></i> <span id="total-count">0</span></span>
                </div>
            </header>

            <div class="input-section">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="task-input"
                        class="task-input"
                        placeholder="Введи новую задачу..."
                        autocomplete="off"
                    >
                    <button class="add-btn" id="add-btn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-th-list"></i> Все
                    </button>
                    <button class="filter-btn" data-filter="active">
                        <i class="fas fa-circle"></i> Активные
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        <i class="fas fa-check-circle"></i> Выполненные
                    </button>
                </div>
            </div>

            <div class="tasks-container">
                <ul class="task-list" id="task-list">
                    <!-- Задачи будут добавлены сюда -->
                </ul>
                <div class="empty-state" id="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-inbox"></i>
                    </div>
                    <p>Нет задач. Добавь свою первую!</p>
                </div>
            </div>

            <footer class="footer">
                <button class="clear-btn" id="clear-btn">
                    <i class="fas fa-trash"></i> Очистить выполненные
                </button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
